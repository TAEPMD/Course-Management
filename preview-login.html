<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Preview — Login security UI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./src/style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div id="app-root"></div>
<script>
// ดึงเฉพาะบล็อก view-login จาก index.html จริง มาแสดงพร้อม state ต่าง ๆ
fetch('./index.html').then(r => r.text()).then(html => {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const login = doc.getElementById('view-login');
  login.classList.remove('hidden');
  document.getElementById('app-root').appendChild(document.importNode(login, true));

  const keys = ['1','2','3','4','5','6','7','8','9','C','0','<'];
  const pad = document.getElementById('login-numpad');
  keys.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = k === 'C'
      ? 'numpad-btn bg-red-50 text-red-500 font-black text-lg rounded-2xl h-14'
      : k === '<'
      ? 'numpad-btn bg-slate-100 text-slate-600 font-black text-xl rounded-2xl h-14'
      : 'numpad-btn bg-white text-slate-800 font-bold text-xl rounded-2xl h-14 shadow-sm border border-gray-100';
    b.innerHTML = k === '<' ? '<i class="fa-solid fa-delete-left"></i>' : k;
    pad.appendChild(b);
  });

  const boxes = document.querySelectorAll('#pin-display .pin-box');
  const mode = location.hash;
  if (mode === '#error' || mode === '#lock') {
    boxes.forEach((b, i) => { if (i < 3) { b.classList.add('filled'); b.innerHTML = '<span class="w-3 h-3 rounded-full bg-white inline-block"></span>'; } });
    document.getElementById('login-identifier').value = 'somchai';
  }
  if (mode === '#error') {
    const err = document.getElementById('login-error');
    err.textContent = 'ชื่อผู้ใช้หรือ PIN ไม่ถูกต้อง';
    err.classList.remove('hidden');
  }
  if (mode === '#lock') {
    const lock = document.getElementById('login-lock');
    lock.innerHTML = '<i class="fa-solid fa-lock"></i> ป้อนรหัสผิดหลายครั้ง — ลองใหม่ได้ในอีก <strong>04:37</strong>';
    lock.classList.remove('hidden');
    pad.classList.add('opacity-50');
  }
});
</script>
</body>
</html>
